name: Compilar 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          arm-none-eabi-gcc -specs=3dsx.specs -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -O2 -D__3DS__ -I/opt/devkitpro/libctru/include source/*.c -L/opt/devkitpro/libctru/lib -lctru -lm -o mi_juego_3ds.elf
          smdhtool --create "Mi Juego 3DS" "Hecho con Edit3DS" "Yo" /opt/devkitpro/libctru/default_icon.png mi_juego_3ds.smdh
          3dsxtool mi_juego_3ds.elf mi_juego_3ds.3dsx --smdh=mi_juego_3ds.smdh
      - name: Subir el 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: mi_juego_3ds
          path: |
            mi_juego_3ds.3dsx
            mi_juego_3ds.smdh
