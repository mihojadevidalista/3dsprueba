name: Compilar 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - name: Subir el .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: hola3ds
          path: |
            hola3ds.3dsx
            hola3ds.smdh
