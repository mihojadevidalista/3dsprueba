name: Compilar 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          arm-none-eabi-gcc -specs=3dsx.specs -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -O2 -D__3DS__ -I/opt/devkitpro/libctru/include source/*.c -L/opt/devkitpro/libctru/lib -lctru -lm -o muneco.elf
          smdhtool --create "Munequito Runner" "Mi primer juego" "Yo" /opt/devkitpro/libctru/default_icon.png muneco.smdh
          3dsxtool muneco.elf muneco.3dsx --smdh=muneco.smdh
      - name: Subir el 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: muneco
          path: |
            muneco.3dsx
            muneco.smdh
